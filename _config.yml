title: Vlad Khambir
tagline: The world through the eyes of an iOS engineer
description: >-
  Vlad Khambir writes about iOS, Swift, SwiftUI, architecture,
  and the craft of software.
url: "https://www.vladkhambir.com"
baseurl: ""
lang: en
timezone: America/New_York

author:
  name: Vlad Khambir
  email: vlad.khambir@gmail.com
  linkedin: https://linkedin.com/in/khambir

hero:
  badge: iOS Engineer
  description: >-
    I build iOS apps and write about Swift, SwiftUI, architecture, and the craft
    of software. Occasionally about productivity, teams, and everything in between.

newsletter:
  name: The iOS Weekly Brief
  url: https://iosweeklybrief.com/
  description: >-
    Every Friday: Apple and Swift news, hand-picked articles, and tools.
    A short, sharp briefing for iOS developers.

google_analytics: G-KRLH8JT200

permalink: /posts/:title/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - tools
  - vendor
  - node_modules
  - homepage-example.html
  - swift-package-index-reports
